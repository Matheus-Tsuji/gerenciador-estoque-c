name: Build e Release do Executavel

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Compilar com GCC
        run: |
          gcc -Wall -Wextra -O2 main.c -o gerenciador_estoque.exe

      - name: Disponibilizar artefato de download
        uses: actions/upload-artifact@v4
        with:
          name: gerenciador_estoque-windows
          path: gerenciador_estoque.exe

      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gerenciador_estoque.exe
          name: Versao ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
